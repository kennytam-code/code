name: Trapped Cash validation

on:
  push:
    branches: [main]
    paths:
      - 'trapped_cash_export.py'
      - 'trapped_cash_export.ipynb'
      - 'trapped_cash/**'
      - '.github/workflows/trapped-cash-validation.yml'
  pull_request:
    paths:
      - 'trapped_cash_export.py'
      - 'trapped_cash_export.ipynb'
      - 'trapped_cash/**'
      - '.github/workflows/trapped-cash-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exporter-tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            trapped_cash
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: python -m pip install -r trapped_cash/requirements.txt
      - name: Verify Windows Outlook library imports
        if: runner.os == 'Windows'
        run: python -c "import pythoncom, win32com.client; print('Outlook COM libraries imported successfully')"
      - name: Validate extractor, Excel export, and notebook
        run: python -m unittest discover -s trapped_cash/tests -v
