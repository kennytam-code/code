name: PCA hedge validation
on:
  push:
    branches: [main]
    paths: ['pca_hedge_v103_full.py', 'pca_hedge_v103_full.ipynb', 'pca_hedge_v115_peer_pca_diagnostics.py', 'pca_hedge_v115_peer_pca_diagnostics.ipynb', 'pca_requirements*.txt', 'tests/test_*.py', '.github/workflows/pca-validation.yml']
  pull_request:
    paths: ['pca_hedge_v103_full.py', 'pca_hedge_v103_full.ipynb', 'pca_hedge_v115_peer_pca_diagnostics.py', 'pca_hedge_v115_peer_pca_diagnostics.ipynb', 'pca_requirements*.txt', 'tests/test_*.py', '.github/workflows/pca-validation.yml']
jobs:
  offline-tests:
    runs-on: ${{ matrix.os }}
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        dependencies: [minimum, current]
        python: ['3.12']
        include:
          - os: ubuntu-latest
            dependencies: legacy
            python: '3.8'
          - os: windows-latest
            dependencies: legacy
            python: '3.8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Python 3.8 legacy dependencies
        if: matrix.dependencies == 'legacy'
        run: python -m pip install -r pca_requirements-py38.txt
      - name: Install minimum dependencies
        if: matrix.dependencies == 'minimum'
        run: python -m pip install -r pca_requirements-min.txt
      - name: Install current dependencies
        if: matrix.dependencies == 'current'
        run: python -m pip install -r pca_requirements.txt
      - name: Validate Yahoo client imports before analysis tests
        run: python -c "import yfinance as yf; assert callable(yf.screen); assert yf.EquityQuery('eq', ['exchange', 'HKG']).to_dict()['operator'] == 'EQ'"
      - name: Validate cached-data analysis and notebook
        if: matrix.dependencies != 'legacy'
        env:
          MPLBACKEND: Agg
          PYTHONUTF8: 1
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Validate current engine on Python 3.8
        if: matrix.dependencies == 'legacy'
        env:
          MPLBACKEND: Agg
          PYTHONUTF8: 1
        run: python -m unittest discover -s tests -p "test_pca_*.py" -v
